agents:
  queue: hosted

cache: ".buildkite/cache-volume"

env:
  MISE_GITHUB_ATTESTATIONS: "false"
  MISE_RUBY_GITHUB_ATTESTATIONS: "false"
  MISE_RUBY_PRECOMPILED_URL: "https://github.com/jdx/ruby/releases/download/{version}/ruby-{version}.{platform}.tar.gz"

common_mise_plugin: &mise_plugin
  version: 2026.6.6

steps:
  - label: ":semver: Verify tag matches version.rb"
    key: verify-tag
    if: build.tag != null
    command: mise run release:verify-tag
    plugins:
      - mise#v1.1.4: *mise_plugin

  - label: ":pipeline: Build reviewable packages"
    depends_on: verify-tag
    command: buildkite-agent pipeline upload .buildkite/package.pipeline.yml

  - wait: ~

  - block: ":rubygems: Approve publication"
    prompt: "Publish the tested gems from this tagged commit to RubyGems? This cannot be undone."
    if: build.tag != null && build.env("DRY_RUN") != "true"

  # Branch/PR packages never reach this pipeline. A tag, successful packaging,
  # and a human unblocking this build are all required for publication.
  - label: ":rubygems: Publish"
    if: build.tag != null && build.env("DRY_RUN") != "true"
    command: |
      buildkite-agent artifact download "pkg/*.gem" .
      ls -lh pkg/*.gem
      mise run release:publish-gems
    plugins:
      - mise#v1.1.4: *mise_plugin
      - rubygems-oidc#v0.2.0:
          role: rg_oidc_akr_r6thqg88pvavbjycrh8h
