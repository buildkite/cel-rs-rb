agents:
  queue: hosted

cache: ".buildkite/cache-volume"

env:
  MISE_GITHUB_ATTESTATIONS: "false"
  MISE_RUBY_GITHUB_ATTESTATIONS: "false"
  MISE_RUBY_PRECOMPILED_URL: "https://github.com/jdx/ruby/releases/download/{version}/ruby-{version}.{platform}.tar.gz"

common_mise_plugin: &mise_plugin
  version: 2026.6.6

steps:
  # One-off recovery branch only: do not merge this pipeline into main.
  - label: ":package: Recover generic 0.3.1 from original release source"
    key: ruby-gem
    command: |
      git checkout --detach d2409aea59faa01225b0744225b7e1d328db6e12
      mise run release:build-ruby-gem
      ruby -rrubygems/package -e '
        s = Gem::Package.new("pkg/cel-rs-rb-0.3.1.gem").spec
        abort "Wrong gem" unless s.version.to_s == "0.3.1" && s.platform.to_s == "ruby"'
      buildkite-agent artifact upload "pkg/cel-rs-rb-0.3.1.gem"
    plugins:
      - mise#v1.1.4: *mise_plugin

  - label: ":rubygems: Publish only the missing generic 0.3.1 gem"
    depends_on: ruby-gem
    command: |
      buildkite-agent artifact download "pkg/cel-rs-rb-0.3.1.gem" .
      ruby -rrubygems/package -e '
        s = Gem::Package.new("pkg/cel-rs-rb-0.3.1.gem").spec
        abort "Wrong gem" unless s.version.to_s == "0.3.1" && s.platform.to_s == "ruby"'
      gem push "pkg/cel-rs-rb-0.3.1.gem"
    plugins:
      - mise#v1.1.4: *mise_plugin
      - rubygems-oidc#v0.2.0:
          role: rg_oidc_akr_r6thqg88pvavbjycrh8h
